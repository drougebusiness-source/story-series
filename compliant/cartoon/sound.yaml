# One soft background bed per set (music or ambience), made once with Lyria and reused every episode.
records_floor: Cold orderly office ambience with soft ticking clocks and distant typewriters, under a slow, prim, slightly ominous string quartet. Quiet background, no drums, no vocals.
clerk_desk: A slow, sparse, ominous solo piano in a cold bureaucratic office, a faint ticking clock. Quiet background, no drums, no vocals.
meridian_street: A distant propaganda brass fanfare echoing over a grey city plaza, slow and solemn, faint crowd murmur. Quiet background, no vocals.
