# Cut 2026-11-17 to 15-29 s (owner: short form; no teaser, no recap). Long version in backups/2026-11-17-long/.
title: The Delete Pile
stills: true
shots:
- set: records_floor
  cast:
  - Ezra Vale
  - Juno Park
  frame: Wide shot. Endless rows of identical grey desks, every desk filled with a grey-uniformed clerk typing, heads down,
    all in unison. Ezra sits perfectly upright typing at his desk among them; Juno sits at the next desk holding a mug. Ezra
    has a clean face with no scars.
  motion: The clerks type in unison. Ezra stamps a file with quiet satisfaction and squares it neatly on the desk. Juno sips
    her mug.
  secs: 3
  caption: Citizen 213 has deleted eleven thousand people. He has never once looked up.
  line: Citizen two-thirteen has deleted eleven thousand people. He has never once looked up.
- set: clerk_desk
  cast:
  - Ezra Vale
  frame: Medium shot. Ezra at the desk, the monitor showing rows of glowing green lines with no readable text; a small content
    smile.
  motion: Ezra taps the keys in a neat rhythm, scrolling, nodding slightly to himself.
  secs: 3
  caption: Batch 4471. Forty names. Home by six.
  line: Batch forty-four seventy-one. Forty names. Home by six.
- set: clerk_desk
  cast:
  - Ezra Vale
  framing: the same set, close-up on Ezra's face
  frame: Close-up of Ezra's face lit acid green by the monitor, half in hard black shadow, his smile just starting to drop.
    Smooth clean skin, no scars, no stitches, no marks.
  motion: Ezra's smile drops, his eyes widen slowly and he leans toward the screen. Hold.
  secs: 3
  caption: 'Then he reads one. 39: MIRA VALE. UNPERSON.'
  line: Then he reads one. Number thirty-nine. Mira Vale. Unperson.
- set: clerk_desk
  cast:
  - Ezra Vale
  framing: the same set, close on the desk and Ezra's hand
  frame: Ezra's hand hovers over the keyboard, one finger above a single red key, the green monitor glow on his knuckles.
    No scars, stitches or marks on his face, hands or suit.
  motion: His finger trembles above the red key; the monitor glow pulses slowly like a blinking cursor; his hand pulls back
    an inch, then hovers again.
  secs: 3
  caption: Mira Vale is his sister. She still sends postcards from the farms.
  line: Mira Vale is his sister. She still sends postcards from the farms.
- set: records_floor
  cast:
  - Juno Park
  - Ezra Vale
  framing: the same set, medium shot of the two neighbouring desks
  frame: Juno at the next desk peers over her round glasses straight at Ezra, mug in hand; Ezra in the foreground, frozen
    at his screen.
  motion: Juno slowly lowers her mug, eyes fixed on Ezra, then gives a small, too-sweet smile. Ezra doesn't move.
  secs: 3
  caption: Every keystroke here is logged. And Juno has stopped typing.
  line: Every keystroke here is logged. And Juno has stopped typing.
choice:
  question: Delete his sister, or steal her file?
  options:
    A: Delete it as ordered
    B: Secretly copy the file first
