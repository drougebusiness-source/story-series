# Every recurring character gets a voice. World: ROLL FOR FATE is olden-times Britain told by commoners: rough,
# earthy regional British accents (West Country, Yorkshire, Cockney), not posh. Crows is a foreigner with another accent.
# key = the speaker as written before ":" in a caption (or narrator). brief = casting spec. kokoro = free stand-in.
narrator:
  brief: an old tavern storyteller; warm, gravelly working-class English, a bit theatrical, like he's had one ale
  kokoro: bm_fable
  gemini: Algenib
  engine: eleven
  eleven: HOLINJYuuNipXUTD7z8k     # OWNER PICK 2026-11-19 (the owner chose this voice; never change it without asking)
wren:
