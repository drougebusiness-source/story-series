# One painted plate per location, reused by every shot and every episode, so backgrounds never change.
lantern_hall: >-
  The great Lantern Hall of a knightly order: a tall stone hall with pointed arches, dozens of golden lanterns
  hanging on chains, long forest-green banners with a simple gold lantern emblem, a raised stone dais with a carved
  empty throne-like chair at the far end, warm golden light and long shadows on a polished stone floor.
stable_night: >-
  A wooden castle stable at night: rough plank stalls, straw on the floor, a hay pile, a saddle on a rail, a single
  oil lantern hanging from a beam giving a warm gold glow, moonlight falling through an open hayloft window in cool
  blue, an empty stall door in front.
vault_corridor: >-
  A narrow stone corridor deep under a castle leading to a round iron vault door set with a gold lantern emblem, two
  wall torches, moss between the stones, steps down from the left, dark ink-blue shadows and warm torchlight.
