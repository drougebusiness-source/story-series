# One soft background bed per set (music or ambience), made once with Lyria and reused every episode. Kept quiet
# under the voices. Owner 2026-11-13: light, never distracting.
lantern_hall: A gentle solo medieval lyre played by a bard, slow calm wistful folk melody, soft echo of a stone castle hall. Sparse, quiet background music, no drums, no vocals.
stable_night: Quiet nighttime barn ambience, no melody, no music; horses softly snorting and shuffling in straw, a goat bleating once far off, crickets outside, a gentle breeze through wooden boards, an owl far away. Calm, very soft, field recording.
vault_corridor: Low dark ambient drone in a stone dungeon, slow dripping water, a distant torch crackle, faint low cello note. Very sparse and quiet, no drums, no vocals.
