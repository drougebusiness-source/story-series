# Design notes that must hold in every picture of this character (fixes found in review).
Wren Ashby: >-
  She is clearly a grown young WOMAN of 23, not a child and not a boy: a feminine adult face with defined cheekbones,
  freckles, slightly longer cropped copper hair framing her face, a woman's build under the armour.
  Out of armour she always wears the same padded clothes: a maroon quilted jacket with green sleeves, green trousers,
  brown boots.
Crows: >-
  An ordinary-sized raven, no bigger than a real raven: about as long as Wren's forearm, his whole body smaller than
  her head and shoulders. Never giant. Sleek black feathers with one white feather on his head.
