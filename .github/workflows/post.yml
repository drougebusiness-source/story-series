name: Post episode

# The owner's week: Mon/Wed/Fri evenings (Central) - 6 PM COMPLIANT, 7 PM THE LAST DRAFT, 8 PM ROLL FOR FATE,
# 9 PM DRIFTBORN. GitHub's timer is UTC and sometimes fires late or skips (it skipped all of Fri 11-20), so
# `stories due` posts any series whose slot has come, whatever hour it wakes in. 20 minutes after each slot the PC
# (post_check.py, Windows Task Scheduler) checks it went up and, if not, starts this job by hand and re-checks.
# The PC writes, renders and quality-checks each episode and, after the owner's OK, publishes it as a release
# <series>-epN (publish.py). This only posts what's there; a missing episode is skipped, never made up.
on:
  schedule:
    - cron: "0 0,1,2,3 * * 2,4,6"    # Mon/Wed/Fri 6, 7, 8, 9 PM CST
    - cron: "0 23 * * 1,3,5"         # 6 PM CDT (summer); the 7-9 PM CDT slots are the 0-2 UTC runs above
  workflow_dispatch:
    inputs:
      series:
        description: "Series to post now (compliant, last-draft, roll-for-fate, driftborn)"
        required: true

concurrency: story-state   # one run at a time, so commits never collide

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post
        env:
          IG_USER_ID_CITIZEN213: ${{ secrets.IG_USER_ID_CITIZEN213 }}
          META_PAGE_TOKEN_CITIZEN213: ${{ secrets.META_PAGE_TOKEN_CITIZEN213 }}
          IG_USER_ID_LASTDRAFTSURVIVAL: ${{ secrets.IG_USER_ID_LASTDRAFTSURVIVAL }}
          META_PAGE_TOKEN_LASTDRAFTSURVIVAL: ${{ secrets.META_PAGE_TOKEN_LASTDRAFTSURVIVAL }}
          IG_USER_ID_ROLLFORFATE: ${{ secrets.IG_USER_ID_ROLLFORFATE }}
          META_PAGE_TOKEN_ROLLFORFATE: ${{ secrets.META_PAGE_TOKEN_ROLLFORFATE }}
          IG_USER_ID_DRIFTBORN: ${{ secrets.IG_USER_ID_DRIFTBORN }}
          META_PAGE_TOKEN_DRIFTBORN: ${{ secrets.META_PAGE_TOKEN_DRIFTBORN }}
        run: |
          set -o pipefail
          if [ -n "${{ inputs.series }}" ]; then python -m stories post "${{ inputs.series }}"
          else python -m stories due; fi | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save the story state
        if: always()
        run: |
          set -o pipefail
          git config user.name "story-bot"
          git config user.email "story-bot@users.noreply.github.com"
          git add */state.json
          git diff --cached --quiet || (git commit -m "posted: update story state" && git pull --rebase -q && git push)
