name: Answer votes

# Every 4 hours: reply "B counted 🗳️" to each new vote on the open episodes (stories engage). Replies show voters
# they were heard and roughly double the comment count Instagram ranks on.
on:
  schedule:
    - cron: "30 */4 * * *"
  workflow_dispatch:

concurrency: story-state

jobs:
  engage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Answer
        env:
          IG_USER_ID_CITIZEN213: ${{ secrets.IG_USER_ID_CITIZEN213 }}
          META_PAGE_TOKEN_CITIZEN213: ${{ secrets.META_PAGE_TOKEN_CITIZEN213 }}
          IG_USER_ID_LASTDRAFTSURVIVAL: ${{ secrets.IG_USER_ID_LASTDRAFTSURVIVAL }}
          META_PAGE_TOKEN_LASTDRAFTSURVIVAL: ${{ secrets.META_PAGE_TOKEN_LASTDRAFTSURVIVAL }}
          IG_USER_ID_ROLLFORFATE: ${{ secrets.IG_USER_ID_ROLLFORFATE }}
          META_PAGE_TOKEN_ROLLFORFATE: ${{ secrets.META_PAGE_TOKEN_ROLLFORFATE }}
          IG_USER_ID_DRIFTBORN: ${{ secrets.IG_USER_ID_DRIFTBORN }}
          META_PAGE_TOKEN_DRIFTBORN: ${{ secrets.META_PAGE_TOKEN_DRIFTBORN }}
        shell: bash
        run: python -m stories engage | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save the story state
        if: always()
        run: |
          git config user.name "story-bot"
          git config user.email "story-bot@users.noreply.github.com"
          git add */state.json
          git diff --cached --quiet || (git commit -m "replies: update story state" && git pull --rebase -q && git push)
