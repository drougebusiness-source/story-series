name: Preview episode

# Makes the NEXT episode of one series as a video you can download from this run (Artifacts), without posting or
# changing the story. For episode 1 the draft is saved, so what you approve is exactly what gets posted.
on:
  workflow_dispatch:
    inputs:
      series:
        description: "compliant, last-draft, roll-for-fate or driftborn"
        required: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg && pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/stories
          key: art-${{ github.run_id }}
          restore-keys: art-
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m stories preview "${{ inputs.series }}"
      - name: Keep the episode 1 draft
        run: |
          git config user.name "story-bot"
          git config user.email "story-bot@users.noreply.github.com"
          git add */episodes 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "preview: episode 1 draft for ${{ inputs.series }}" && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ inputs.series }}
          path: |
            out/*.mp4
            out/*.json
            out/*.txt
          retention-days: 14
