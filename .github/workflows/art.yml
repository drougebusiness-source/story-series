name: Profile art

# Gemini draws profile picture options for one series (about 3-4 cents each). Download them from this run's Artifacts.
on:
  workflow_dispatch:
    inputs:
      series:
        description: "compliant, last-draft, roll-for-fate or driftborn"
        required: true
        default: driftborn
      n:
        description: "How many options (max 6)"
        required: true
        default: "3"

jobs:
  art:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m stories art "${{ inputs.series }}" --n "${{ inputs.n }}"
      - uses: actions/upload-artifact@v4
        with:
          name: profile-art-${{ inputs.series }}
          path: out/art/*.png
          retention-days: 14
