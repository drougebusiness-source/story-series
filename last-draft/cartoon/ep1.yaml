title: Day 731
# Sloane 2026-11-16 (approved tone change): HORROR, narrated second person (HORROR-FORMAT.md). The viewer is Cole.
# Every caption is the narrator (no "NAME:" prefix), so nobody needs lip sync. One weak light per shot.
# Plants for the EP2-EP5 pay-off (it was a dog, not the dead): the house "with the barking" (shot 5), and
# "nobody hides a bite for three days" (shot 10). Both read as dread now and as clues later.
shots:
  - set: school_hallway
    cast: []
    frame: Almost total darkness. One camping lantern on the floor in the near foreground, its small orange pool lighting a man's hand resting on a sleeping bag, a cardigan cuff, and a pair of tape-mended glasses folded beside it. Beyond the light, the hallway vanishes into black.
    motion: The lantern flame gutters low. From the black at the far end of the hall comes a slow scratching. The hand on the sleeping bag goes completely still. Long hold.
    secs: 7
    caption: It's two in the morning, and somebody down the hall is scratching. Slow. Like they're trying not to.
    line: It's two in the morning, and somebody down the hall is scratching. Slow. Like they're trying not to.
    sfx: [{sound: slow_scratch, at: 1.0, gain: 0.35}]
  - set: supply_street
    cast: []
    frame: The overgrown street at night under a thin moon, the only light; dead cars and dark houses in black silhouette; far down the road a single dead figure stands in the moonlight.
    motion: Tall grass stirs in the wind. Far away, the dead figure turns and shambles slowly across the road into the dark.
    secs: 9
    caption: Two years ago the dead got up. You taught chemistry. Now seven of you live in your old school, and you still take roll every morning.
    line: Two years ago the dead got up. You taught chemistry. Now seven of you live in your old school, and you still take roll every morning.
  - set: school_yard
    cast: [Dani Ortiz, Marcus "Tank" Bell]
    frame: Earlier that day. The yard in hard orange late sun, long black shadows. Tank in a tank top hauls a sandbag; behind him Dani stacks tins by the bus in a grey long-sleeved hoodie, sleeves pulled down over her knuckles.
    motion: Tank wipes sweat off his face and drops the sandbag on the pile. Dani keeps stacking tins, tugging one sleeve down further.
    secs: 6
    caption: Today it hit ninety degrees. Everyone stripped to tank tops. Dani kept her sleeves down over her knuckles.
    line: Today it hit ninety degrees. Everyone stripped to tank tops. Dani kept her sleeves down over her knuckles.
  - set: school_yard
    cast: [Dani Ortiz, Marcus "Tank" Bell]
    framing: the same set, medium shot
    frame: Tank grinning beside Dani, his big hand raised to clap her left forearm; Dani in the long-sleeved grey hoodie.
    motion: Tank claps Dani's forearm in a friendly slap. Dani jerks away hard and clutches the arm to her chest. Tank's grin falls. Dani forces a smile that doesn't reach her eyes.
    secs: 5
    caption: When Tank slapped her arm, she flinched like he'd burned her.
    line: When Tank slapped her arm, she flinched like he'd burned her.
  - set: supply_street
    cast: []
    framing: the same set, closer on one house
    frame: Dusk. One house with a sagging porch, its front door hanging open on one hinge, pure black inside. The last grey daylight is the only light.
    motion: The door swings slightly in the wind and creaks. Nothing comes out. Hold on the dark doorway.
    secs: 7
    caption: Three days ago, on the supply run, Dani went into a house alone. The one with the barking.
    line: Three days ago, on the supply run, Dani went into a house alone. The one with the barking.
  - set: school_hallway
    cast: []
    framing: the same set, close-up on the corkboard
    frame: The corkboard in the lantern's edge light, the hand-drawn map pinned to it, and beside the map a single sheet of paper with seven tally marks in black marker. Everything else is shadow.
    motion: A draft lifts the corner of the paper and lets it fall. The lantern light trembles across the seven marks.
    secs: 7
    caption: You all voted on one rule. A bite means a bullet. Dani voted yes. Dani voted first.
    line: You all voted on one rule. A bite means a bullet. Dani voted yes. Dani voted first.
  - set: school_hallway
    cast: []
    framing: the same set, low close-up along the floor
    frame: A man's hand lifting the camping lantern off the floor; its light swings onto an empty, unzipped sleeping bag a few steps away.
    motion: The hand raises the lantern slowly. The pool of light slides along the floor onto the empty sleeping bag. The scratching stops dead. Hold in the quiet.
    secs: 6
    caption: You lift the lantern. Dani's sleeping bag is empty. And the scratching stops.
    line: You lift the lantern. Dani's sleeping bag is empty. And the scratching stops.
    sfx: [{sound: slow_scratch, gain: 0.3}]
  - set: school_hallway
    cast: [Dani Ortiz]
    framing: the same set, long view down the hall from behind the raised lantern
    frame: The far end of the hallway, empty and black at first.
    motion: The lantern light creeps slowly down the hall and finds Dani, who is standing at the barricade with her back to us, her sleeve pushed up to the elbow, the arm held in front of her where we can't see it. She doesn't turn around. Slowly she pulls the sleeve back down.
    secs: 9
    caption: "She's at the barricade, back to you. She doesn't turn. She whispers: \"Mister Mercer. Tomorrow at roll call... skip my name.\""
    line: She's at the barricade, back to you. She doesn't turn around. She whispers, Mister Mercer. Tomorrow at roll call, skip my name.
  - set: school_hallway
    cast: []
    framing: the same set, close-up on the lantern
    frame: Close-up of the camping lantern held in a hand, its flame low, darkness all around.
    motion: The flame shrinks and steadies. The hand holding the lantern trembles once, then holds still.
    secs: 8
    caption: Nobody hides a bite for three days. Nobody gets the chance. Roll call is at seven. You have five hours.
    line: Nobody hides a bite for three days. Nobody gets the chance. Roll call is at seven. You have five hours.
  - set: school_hallway
    cast: [Dani Ortiz]
    framing: the same set, long view down the hall from behind the raised lantern, as in shot 8
    frame: The far end of the hallway at the edge of the lantern light. Dani stands at the barricade with her back to us, both sleeves pulled down, arms held in front of her out of sight.
    motion: Dani stays perfectly still, her back to us. Very slowly, the lantern light dims at the edges. Hold.
    secs: 8
    caption: Option A, you wake the group and tell them. Option B, you keep her secret, and you watch her. Comment A or B.
    line: Option A, you wake the group and tell them. Option B, you keep her secret, and you watch her. Comment A or B.
choice:
  question: Dani is hiding her arm. Roll call is at 7. What do you do?
  options: {A: Wake the group and tell them, B: Keep her secret and watch her}

teaser: {shot: 8, secs: 2}     # Sloane: the light finds Dani's back at the barricade, before she speaks
