# One painted plate per location, reused by every shot and every episode, so backgrounds never change.
school_yard: >-
  The courtyard of a fortified suburban high school two years after the end of the world: a tall chain-link fence
  reinforced with plywood, car doors and barbed wire; an old yellow school bus parked sideways as a wall; vegetable
  beds in old tyres; laundry on a line; the brick school building behind with boarded windows; weeds through cracked
  asphalt; late afternoon sun low and orange.
school_hallway: >-
  A dim high school hallway used as the group's home: dented lockers on both sides, a barricade of desks and chairs
  at the far end, sleeping bags along the wall, a hand-drawn map pinned to a corkboard, one camping lantern on the
  floor giving a warm orange pool of light, everything beyond it in cold teal shadow.
supply_street: >-
  An overgrown suburban street: abandoned rusted cars with flat tyres, front lawns gone to tall grass, houses with
  broken windows and sagging porches, a toppled street sign, ivy over a fence, a pale washed-out sky, quiet and
  empty, a long road leading away in the distance.
