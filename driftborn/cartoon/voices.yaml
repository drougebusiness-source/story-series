# Every recurring character gets a voice. World: DRIFTBORN is space travellers from everywhere: some polished and
# proper (the Concord), some rough frontier country (the rust moons). Pick per character.
# key = the speaker as written before ":" in a caption (or narrator). brief = casting spec. kokoro = free stand-in.
narrator:
  brief: a deep, calm, sophisticated space-documentary narrator, like an old starship log
  kokoro: am_onyx@0.95
  gemini: Charon
  eleven: VMCgCMbBs53ElBxVD4VB     # "Steven - Deep Documentary Narrator" (11-16: Gemini narration dropped words)
  engine: eleven
kael:
  name: Kael Torvin
  brief: a wiry 19-year-old junk-diver raised on a rust mining moon; bright, clear, quick young teen-hero voice (owner 11-16, the energetic cocky rebel-kid type), cheeky and curious, voice of a kid who talks to machines
  kokoro: am_puck
  eleven: S0ypc51SmsvcKXTWvjqJ
  gemini: Zubenelgenubi
sola:
  name: Sola Venn
  brief: a 21-year-old engineer; quick, dry and sarcastic, clipped spacer slang, sounds like she's always mid-repair
  kokoro: af_nova
  eleven: dmWfLQZJq7wNPv9WmtiM
  gemini: Zephyr
iva:
  name: Captain Iva Rhoss
  brief: a 35-year-old smuggler pilot; husky, laid-back southern country drawl, warm but dangerous when serious
  kokoro: af_bella@0.95
  gemini: Kore
holt:
  name: Prefect Daren Holt
  brief: a calm 45-year-old Concord officer; polished, very proper upper-class English, soft-spoken and precise, never raises his voice
  kokoro: bm_george
  gemini: Iapetus
wick:
  name: Wick
  brief: a hulking 300-year-old mining robot; slow, deep, rumbling and kind, slightly metallic, old-fashioned words
  kokoro: am_santa@0.8
  gemini: Orus
