- set: wreck_inside
  cast:
  - Kael Torvin
  frame: The dark tilted corridor inside the wreck, a dim square of daylight from the hatch above. Kael has just landed in
    a proud hero crouch in the middle of the floor, and the metal floor panel under him has sagged into a dent; his wrist
    lamp throws a white beam.
  motion: Kael drops in from above and lands in a perfect hero crouch. The floor panel under him sags with a loud metal clank.
    He freezes. His wrist lamp flickers, sparks and dies; he smacks it twice and it blinks on, its white beam pointing ahead
    into the dark, dust drifting through it.
  secs: 3
  caption: Kael hears machines. Nobody else on Hollow ever has.
  line: Kael hears machines. Nobody else on Hollow ever has.
