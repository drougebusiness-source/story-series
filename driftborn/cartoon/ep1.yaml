# Cut 2026-11-17 to 15-29 s (owner: short form; no teaser, no recap). Long version in backups/2026-11-17-long/.
title: Scrap
shots:
- set: wreck_outside
  cast:
  - Kael Torvin
  - Sola Venn
  frame: Wide shot. Kael and Sola stand on the red sand a few steps apart in front of the wreck. Behind Kael is only smooth,
    LIGHT riveted hull plating, so his short spiky black hair is clearly outlined against a light background. The dark torn
    hull opening is at the far right edge of the frame, behind and beyond Sola, never behind anyone's head. Kael stands with
    his hands on his hips; Sola holds the binoculars lowered at chest height, looking at Kael with a flat, deadpan stare.
  motion: Sola talks to Kael, deadpan, keeping the binoculars still at her chest. Kael stays standing with his hands on his
    hips and slowly tilts his head, listening. Small, calm movements only.
  secs: 5
  caption: 'SOLA: Ninety years dead. If you go in there and die, I''m keeping your boots.'
  sfx:
  - sound: core_hum
    hold: true
    gain: 0.1
- set: wreck_outside
  cast:
  - Kael Torvin
  - Sola Venn
  framing: the same set seen closer, a medium shot near the hull opening
  frame: Kael leans toward the dark hull opening with one hand cupped to his ear; Sola stands behind him, squinting at him,
    confused.
  motion: Kael leans in further, listening hard. Sola looks at him, looks at the wreck, looks at him again, then throws her
    hands up.
  secs: 3
  caption: 'KAEL: Then why is it humming?'
