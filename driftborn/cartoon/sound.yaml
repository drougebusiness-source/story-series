# One soft background bed per set (music or ambience), made once with Lyria and reused every episode.
wreck_outside: Lonely desert-planet ambience, soft wind over sand dunes, under a slow warm retro-sci-fi synth melody with a gentle twangy frontier guitar. Quiet background, no drums, no vocals.
wreck_inside: Dark mysterious spaceship-wreck ambience, low hum, faint metal creaks, distant drips, a slow eerie synth pad with a soft pulsing tone. Quiet background, no drums, no vocals.
