# Ep 2 (FLOW EP2-B "The Hum", adapted). Vote 1 closed 2026-11-22: 0 votes, so the story chose B (hide it). Why B: it
# opens the series' core mystery (Wick and the Current) and stays in the two existing sets; A needs Holt, the gunship
# and the village, none of which have sets yet. Written by Sloane 2026-11-22. Needs owner approval.
# Change from FLOW: Kael hides the core inside the dead robot in the wreck (not his shack), so Wick wakes there.
# Plant: Wick calls the core "my heart" (pays off in EP3/EP4: the core is part of Wick, and why it hums with Kael).
